javac.release=17
javac.compilerargs=-Xlint -Xlint:-serial
javadoc.arch=${basedir}/arch.xml
module.jar.dir=lib

javadoc.main.page=org/openide/util/doc-files/api.html
javadoc.arch=${basedir}/arch.xml
javadoc.apichanges=${basedir}/apichanges.xml

# Mockito and dependencies for test compilation
test.unit.cp.extra=\
    ${basedir}/test/unit/lib/mockito-core-5.11.0.jar:\
    ${basedir}/test/unit/lib/byte-buddy-1.14.12.jar:\
    ${basedir}/test/unit/lib/byte-buddy-agent-1.14.12.jar:\
    ${basedir}/test/unit/lib/objenesis-3.3.jar

# Exclude broken upstream test file from compilation
test.unit.excludes=org/openide/util/UtilitiesTopologicalSortTest.java

# Mockito requires byte-buddy-agent as a Java agent
test.unit.run.jvmargs=-javaagent:${basedir}/test/unit/lib/byte-buddy-agent-1.14.12.jar
